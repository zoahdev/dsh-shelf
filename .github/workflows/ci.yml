name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node --test tests/*.test.mjs
      - name: CLI help smoke
        run: node scripts/shelf.mjs list --root /nonexistent || true
